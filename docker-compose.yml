services:
  example-site:
    build: .
    image: recallqc:local
    working_dir: /srv
    command: ["python", "-m", "example_site.server", "--host", "0.0.0.0", "--port", "8080"]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  recall-qc:
    build: .
    image: recallqc:local
    working_dir: /srv
    command: ["python", "-m", "app.server"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      RECALLQC_DATA_DIR: /data
      RECALLQC_PORT: "8000"
      EXAMPLE_SITE_INTERNAL_URL: http://example-site:8080
      EXAMPLE_SITE_PUBLIC_URL: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - recall-data:/data
    depends_on:
      example-site:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  recall-data:
